[project]
name = "atlas"
version = "0.1.0"
description = "Atlas AI Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "AB AL Mamun" }
]

dependencies = ["requests>=2.28"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
atlas = "atlas.cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["atlas"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = []

[tool.hatch.build.targets.wheel]
packages = ["atlas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"