[project]
name = "atlas"
version = "0.1.0"
description = "Atlas AI Operating System"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

authors = [
    { name = "AB AL Mamun" }
]

dependencies = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["atlas"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"