# Atlas Configuration

[application]
name = "Atlas"
version = "0.20.0"

[ai]
provider = "Ollama"
model = "qwen3:8b"
temperature = 0.7
timeout = 300

# Operator-level default for policy-controlled model fallback on routed
# chat.  Safe default: false (explicit opt-in only).  A per-request
# RoutingRequest.allow_fallback can still enable fallback individually.
allow_fallback = false

# Explicit opt-in for external (HTTP) AI providers.  Safe default: false.
# Ordinary conversation is served by the built-in deterministic engine and
# any residual provider routing resolves to the local no-network tier.
# Set to true only to allow opted-in external augmentation.
external_providers = false

# Per-call bound (seconds) for an opted-in external provider during
# ordinary conversation.  A hung provider falls back to the built-in
# engine after this bound instead of blocking for the full provider
# timeout.
conversation_timeout_s = 20.0

# Optional model routing profiles. When absent, safe defaults are used
# (Mock Provider @0.3 + Ollama @0.8 with the configured model).
# Each entry: provider_name, model_name, complexity_score, latency_class,
# cost_tier, supported_tasks, priority.
# [ai.profiles]
# [[ai.profiles]]
# provider_name = "Ollama"
# model_name = "qwen3:8b"
# complexity_score = 0.8
# latency_class = "medium"
# cost_tier = 0.2
# supported_tasks = ["conversation", "analysis", "code"]
# priority = 20

[conversation]
history_limit = 20

# Governed model-assisted change authoring (B4).
# Explicit opt-in ONLY: when false (the default), Atlas uses the existing
# DeterministicChangeSupplier and no model-assisted authoring occurs.
# When true, the kernel may construct ModelAssistedChangeSupplier and inject
# it through the existing change_supplier seam. Owner approval, sandbox-only
# execution, verification, and promotion review remain mandatory.
[development]
model_assisted_authoring = false

# Optional bounded specialist (Command 3B). OFF by default: when false, no
# specialist provider is constructed and the deterministic authoring path is
# byte-for-byte unchanged. When true, the kernel builds the bounded
# specialist -> authoring producer over the EXISTING Atlas-owned seam and the
# configured LOCAL transport (no vendored SDK, no hosted account). The
# specialist output remains UNTRUSTED: it still passes Atlas validation, the
# disposable sandbox, verification, OWNER approval and promotion.
[specialists]
enabled = false
provider_id = "ollama.qwen2.5-coder-7b"
model = "qwen2.5-coder:7b"
host = "http://127.0.0.1:11434"
timeout_seconds = 180.0

[development.envelope]
enabled = true
allowed_operations = ["sandbox_development"]
max_risk_level = "low"
max_runs_per_window = 5
window_seconds = 3600

# Owner/authority foundation (P1/B1.1). Exactly one logical Owner, designated
# explicitly by name. No authentication here; this only establishes the
# owner's stable, highest-authority identity.
[authority]
owner_name = "Owner"

[api_keys]
# Set API keys here or via environment variables:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY
openai = ""
anthropic = ""

[logging]
level = "INFO"

[research]
# Explicit web host allowlist for bounded information acquisition (F8).
# Empty list (default) keeps the web source adapter deny-by-default:
# no external host may be fetched until explicitly listed here.
# HTTP/HTTPS remain the only accepted schemes, and all SSRF protections
# (private/loopback/link-local/metadata ranges, redirect revalidation,
# size/time bounds) stay mandatory regardless of entries.
web_allowed_hosts = ["api.github.com", "raw.githubusercontent.com"]
