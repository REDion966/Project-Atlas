# Atlas Configuration

[application]
name = "Atlas"
version = "0.5.0-alpha"

[ai]
provider = "Ollama"
model = "qwen3:8b"
temperature = 0.7
timeout = 300

[conversation]
history_limit = 20

[api_keys]
# Set API keys here or via environment variables:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY
openai = ""
anthropic = ""

[logging]
level = "INFO"
